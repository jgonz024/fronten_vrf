<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGlobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00c6ff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circulo con degradado azul -->
  <circle cx="55" cy="55" r="48" fill="url(#blueGlobe)" filter="url(#glow)"/>

  <!-- Ondas estilizadas de flujo de aire (VRF) -->
  <path d="M 12 55 Q 35 32 68 45 Q 85 52 98 42 Q 78 58 48 56 Q 28 55 12 55 Z" fill="#ffffff"/>
  <path d="M 15 67 Q 38 48 66 57 Q 82 62 92 54 Q 74 68 46 65 Q 28 64 15 67 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 22 78 Q 42 63 64 70 Q 78 74 86 68 Q 72 78 46 76 Q 32 75 22 78 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Texto VRF en rojo intenso -->
  <text x="118" y="70" font-family="'Outfit', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#ff1744" letter-spacing="1">VRF</text>

  <!-- Texto SYSTEMS en azul marino profundo -->
  <text x="242" y="70" font-family="'Outfit', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#0b1e48" letter-spacing="2">SYSTEMS</text>
</svg>
